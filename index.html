<style>
:root{--green:#3c6253;--ink:#293b33;--muted:#8b948e;--line:#e8eae4;--paper:#fcfcf9}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--paper);font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #789b80;outline-offset:3px}button{border:0;background:none;color:inherit}header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:650;letter-spacing:2px}.logo{display:grid;place-items:center;background:var(--green);color:white;border-radius:11px;width:36px;height:36px;font-size:25px}.brand small{font-size:11px;letter-spacing:2px;color:var(--muted);border-left:1px solid var(--line);padding-left:18px;margin-left:12px;font-weight:400}.header-right{display:flex;align-items:center;gap:22px;color:var(--muted);font-size:12px}.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#e9eee5;color:var(--green)}.app{display:grid;grid-template-columns:224px 330px minmax(0,1fr);height:calc(100dvh - 78px)}aside{background:#f3f5ef;padding:29px 20px;display:flex;flex-direction:column;border-right:1px solid var(--line)}.new{background:var(--green);color:white;width:100%;padding:13px;border-radius:7px;text-align:center;box-shadow:0 4px 8px #355a4910}.nav{display:flex;align-items:center;width:100%;gap:12px;text-align:left;padding:12px 14px;border-radius:6px;margin:5px 0;color:#68756c}.nav.active{background:#e3eade;color:#355845;font-weight:600}.nav .count{margin-left:auto;font-size:12px;opacity:.7}.section-label{font-size:10px;letter-spacing:2px;color:#949e94;margin:30px 14px 10px}.dot{width:8px;height:8px;border-radius:3px;background:#c4aa81;display:inline-block}.dot.green{background:#93a88e}.dot.blue{background:#91a8b5}.aside-bottom{margin-top:auto;padding:22px 10px 0;color:#929a91;font-size:11px;line-height:1.9}.storage{height:3px;background:#e1e5db;margin-bottom:10px}.storage span{display:block;width:15%;height:100%;background:#a7b69d}.list{background:#fafbf7;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.list-head{padding:29px 22px 20px}.list-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:21px}.list-title h1{font-size:20px;margin:0;font-weight:600}.list-title select{border:0;color:#8a938b;background:transparent;font-size:11px;max-width:100px}.search{display:flex;align-items:center;background:#f0f2eb;border:1px solid #e8ebe1;border-radius:6px;padding:10px 12px;gap:9px;color:#919a91}.search input{background:none;border:0;outline:none;width:100%;min-width:0;font-size:12px}.results-label{font-size:11px;color:#98a095;margin-top:20px}.cards{overflow:auto;padding:0 12px 16px}.card{display:block;width:100%;text-align:left;padding:19px 16px;border:1px solid transparent;border-bottom-color:var(--line);border-radius:7px;margin-bottom:5px}.card.active{background:#eef2e7;border-color:#dbe4d0}.card h3{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;gap:10px;font-weight:600}.card p{color:#8e978d;font-size:12px;line-height:1.8;margin:0 0 14px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.card-foot{display:flex;justify-content:space-between;font-size:10px;color:#9ba297}.tag{padding:3px 7px;background:#e8eddf;color:#7e8e70;border-radius:3px}.editor{display:flex;flex-direction:column;background:#fff;min-width:0;min-height:0}.editor-bar{height:70px;margin:0 40px;border-bottom:1px solid #f0f1eb;display:flex;align-items:center;justify-content:space-between;gap:10px}.crumb{font-size:11px;color:#929b92}.actions{display:flex;gap:10px;align-items:center}.icon-btn{padding:7px 10px;color:#869282;border-radius:5px;font-size:15px}.icon-btn:hover{background:#f0f3eb}.icon-btn.selected{color:#af925b}.export{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:7px 11px;color:#68776b}.content{padding:34px 56px 0;flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto}.eyebrow{font-size:10px;letter-spacing:2px;color:#94a187;margin-bottom:16px}.title{font-size:30px;font-weight:600;border:0;outline:none;padding:0;width:100%;color:var(--ink);background:transparent}.metadata{display:flex;align-items:center;gap:14px;font-size:11px;color:#9ca398;margin:18px 0 27px;flex-wrap:wrap}.metadata select{font-size:11px;border:1px solid #e5eadf;background:#f5f7ef;color:#849176;padding:4px;border-radius:4px}.toolbar{display:flex;align-items:center;gap:7px;padding:9px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:23px}.tool{height:28px;min-width:29px;color:#778570;border-radius:4px}.tool:hover{background:#edf1e7}.divider{width:1px;height:15px;background:var(--line);margin:0 5px}.mode{margin-left:auto;font-size:11px;padding:6px 9px;border:1px solid var(--line);border-radius:4px;color:#738568}textarea{width:100%;flex:1;min-height:320px;resize:none;outline:none;border:0;line-height:2.1;font-size:14px;color:#53604f;background:none;padding:0 0 36px;font-family:inherit}.preview{line-height:2;color:#53604f;flex:1;min-height:320px;overflow-wrap:anywhere;padding-bottom:30px}.preview h2{font-size:19px;margin:28px 0 12px}.preview h1{font-size:26px}.preview h3{font-size:16px}.preview p{margin:12px 0}.preview blockquote{border-left:3px solid #b0bea0;background:#f6f8f1;padding:12px 20px;margin:20px 0;color:#859477}.preview code{background:#f0f2e9;padding:3px 5px;border-radius:3px}.preview ul{padding-left:23px}.editor-footer{display:flex;justify-content:space-between;padding:16px 40px;border-top:1px solid var(--line);font-size:10px;color:#9aa194}.empty{padding:50px 20px;text-align:center;color:#909b8b;line-height:2}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#354b3d;color:white;border-radius:8px;box-shadow:0 6px 25px #0002;font-size:13px;z-index:5}.hidden{display:none!important}.mobile-nav{display:none}.tip{font-size:10px;color:#a2aa9a;margin-left:10px}@media(min-width:1450px){.app{grid-template-columns:240px 365px minmax(0,1fr)}.content{padding:45px 8% 0}}@media(max-width:1050px){.app{grid-template-columns:180px 270px minmax(0,1fr)}aside{padding:25px 12px}.content{padding:28px 28px 0}.editor-bar{margin:0 24px}.brand small{display:none}.tip{display:none}}@media(max-width:760px){header{height:65px;padding:0 20px}.header-right>span:first-child{display:none}.app{height:calc(100dvh - 65px);grid-template-columns:1fr}.mobile-nav{display:block}.app aside{display:none}.app .list{display:flex}.app .editor{display:none}.app.editing .list{display:none}.app.editing .editor{display:flex}.list-head{padding-top:22px}.list-title:after{content:none}.content{padding:25px 24px 0}.editor-bar{height:60px;margin:0 20px}.editor-footer{padding:15px 24px}.title{font-size:26px}.mobile-new{display:block!important}.metadata{gap:8px}.brand{font-size:21px}.toolbar{gap:3px}}
aside > .new{background:#7c3aed;box-shadow:0 4px 8px #7c3aed20}
</style>
</head>
<body>
<header><div class="brand"><span class="logo">▤</span>拾页<small>给每一个想法，留一页空间</small></div><div class="header-right"><span>✦ 记录当下，慢慢生长</span><span class="avatar">拾</span></div></header>
<main class="app" id="app">
<aside><button class="new" data-action="new">＋ &nbsp; 新建笔记</button><div class="section-label">我的空间</div><nav id="navigation"></nav><div class="section-label">笔记分类</div><nav id="categories"></nav><div class="aside-bottom"><div class="storage"><span></span></div>你的灵感，妥善保存在此浏览器<br><button data-action="backup" style="padding:5px 0;color:#687d60">↓ 导出全部笔记备份</button></div></aside>
<section class="list"><div class="list-head"><div class="list-title"><h1 id="listTitle">全部笔记</h1><select id="sort" aria-label="笔记排序"><option value="updated">最近更新</option><option value="created">创建时间</option><option value="title">标题排序</option></select></div><div class="search"><span>⌕</span><input id="search" placeholder="搜索笔记中的灵感…" aria-label="搜索笔记"><span style="font-size:10px">⌘ K</span></div><button class="new mobile-new" data-action="new" style="display:none;margin-top:14px">＋ 新建笔记</button><select id="mobileFilter" class="mobile-nav" aria-label="筛选笔记" style="margin-top:12px;width:100%;padding:8px;border:1px solid #dde3d4;background:#fff"><option value="all">全部笔记</option><option value="starred">我的收藏</option><option value="工作">工作笔记</option><option value="生活">生活随记</option><option value="灵感">灵感收集</option><option value="trash">回收站</option></select><div class="results-label" id="resultsLabel"></div></div><div class="cards" id="cards"></div></section>
<section class="editor" id="editor"><div class="editor-bar"><div class="crumb"><button class="mobile-nav" data-action="back" style="display:inline" aria-label="返回笔记列表">‹</button> 我的笔记 &nbsp;/&nbsp; <span id="crumbCategory">生活随记</span></div><div class="actions"><button class="icon-btn" id="star" data-action="star" title="收藏笔记" aria-label="收藏笔记">☆</button><button class="export" data-action="export">↓ 导出</button><button class="icon-btn" id="trash" data-action="trash" title="移入回收站" aria-label="移入回收站">♧</button><button class="export hidden" id="restore" data-action="restore">恢复</button></div></div><div class="content" id="content"><div class="eyebrow">A LITTLE SPACE FOR YOUR MIND</div><input class="title" id="title" placeholder="无标题笔记" aria-label="笔记标题"><div class="metadata"><span id="date"></span><span>·</span><select id="category" aria-label="笔记分类"><option value="生活">生活随记</option><option value="工作">工作笔记</option><option value="灵感">灵感收集</option></select><span id="readTime"></span></div><div class="toolbar"><button class="tool" data-format="heading" title="标题">H₂</button><span class="divider"></span><button class="tool" data-format="bold" title="粗体"><b>B</b></button><button class="tool" data-format="italic" title="斜体"><i>I</i></button><button class="tool" data-format="list" title="项目列表">☷</button><button class="tool" data-format="quote" title="引用">❞</button><button class="tool" data-format="code" title="行内代码">&lt;/&gt;</button><span class="tip">Markdown</span><button class="mode" id="mode" data-action="mode">预览</button></div><textarea id="body" spellcheck="false" aria-label="笔记正文" placeholder="从一个想法开始，写下你的第一行…"></textarea><article class="preview hidden" id="preview"></article></div><div class="empty hidden" id="noNote">选一页笔记，继续你的想法。<br><button class="new" data-action="new" style="width:auto;margin-top:20px">＋ 写下第一篇笔记</button></div><footer class="editor-footer"><span id="saveStatus" role="status">✓ 所有更改已保存到本地</span><span id="wordCount"></span></footer></section>
</main><div class="toast hidden" id="toast" role="status"></div>
<script>
'use strict';
const KEY='shiye.notes.v1';
const $=id=>document.getElementById(id);
const labels={all:'全部笔记',starred:'我的收藏',trash:'回收站',生活:'生活随记',工作:'工作笔记',灵感:'灵感收集'};
const now=Date.now();
const seed=[{id:'welcome',title:'在平凡的日子里，收集微小的美好',category:'生活',starred:true,body:'有时候，生活的美好藏在最不起眼的角落。\n\n一杯刚刚好的咖啡，一段喜欢的旋律，或者下班路上偶然抬头看见的晚霞。\n\n## 值得记录的小事\n\n- 清晨推开窗，闻到雨后青草的味道\n- 读到一本好书，恰好说中了最近的心情\n- 和老朋友散步，聊一些没有目的的话题\n\n> 不必等到特别的日子，才觉得生活值得记录。\n\n## 给自己的小约定\n\n每天留出十分钟，放下手机，把今天的心情写下来。不追求完整，也不要求漂亮，诚实就好。\n\n慢慢来，让日子有迹可循。',created:now-86400000*2,updated:now}, {id:'work',title:'新项目 · 从想法到行动',category:'工作',starred:false,body:'## 本周的三个重点\n\n- 明确项目目标与关键里程碑\n- 整理用户反馈，找到真正的问题\n- 留出时间做一次小范围验证\n\n> 把大问题拆成今天可以完成的一小步。',created:now-86400000,updated:now-3600000},{id:'ideas',title:'一些还没长大的灵感',category:'灵感',starred:true,body:'## 灵感备忘录\n\n- 一间只在雨天营业的书店\n- 把散步路线做成一份城市声音地图\n- 为每个月选一种代表色\n\n先记下来，也许某一天，它们就会开花。',created:now-86400000*3,updated:now-86400000},{id:'books',title:'读书摘记：留一点空白',category:'生活',starred:false,body:'## 阅读时想到的\n\n我们习惯于把日程填满，却忘了留一点空白。\n\n空白让新的可能发生，也让我们听见自己的声音。',created:now-86400000*4,updated:now-86400000*2}].map(n=>({...n,deleted:false}));
let notes,storageFailed=false;
try{const stored=localStorage.getItem(KEY);notes=stored===null?seed:JSON.parse(stored);if(!Array.isArray(notes)||notes.some(n=>!n||typeof n.id!=='string'||typeof n.title!=='string'||typeof n.body!=='string'||!['工作','生活','灵感'].includes(n.category)||!Number.isFinite(n.created)||!Number.isFinite(n.updated)))throw Error('invalid');}catch(e){notes=seed;storageFailed=true;}
let activeId=notes.find(n=>!n.deleted)?.id,filter='all',preview=false,toastTimer;
const current=()=>notes.find(n=>n.id===activeId);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes));$('saveStatus').textContent='✓ 所有更改已保存到本地';storageFailed=false;}catch(e){storageFailed=true;$('saveStatus').textContent='保存失败，请导出备份';notify('浏览器存储不可用或已满，请及时导出备份');}}
function notify(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3000);}
function matches(n){return(filter==='trash'?n.deleted:!n.deleted&&(filter==='all'||filter==='starred'&&n.starred||n.category===filter))&&(`${n.title} ${n.body}`.toLowerCase().includes($('search').value.toLowerCase()));}
function visible(){return notes.filter(matches).sort((a,b)=>$('sort').value==='title'?a.title.localeCompare(b.title,'zh-CN'):b[$('sort').value]-a[$('sort').value]);}
function dateText(time){return new Date(time).toLocaleDateString('zh-CN',{month:'long',day:'numeric'});}
function renderLists(){const list=visible();$('listTitle').textContent=labels[filter];$('resultsLabel').textContent=`${list.length} 篇笔记 · 每一个想法都值得珍藏`;$('cards').innerHTML=list.length?list.map(n=>`<button class="card ${n.id===activeId?'active':''}" data-id="${escape(n.id)}"><h3><span>${escape(n.title||'无标题笔记')}</span>${n.starred?'<span style="color:#b6a273">✦</span>':''}</h3><p>${escape(n.body.replace(/[#*>`]/g,'').trim()||'还没有内容，写下第一个想法吧')}</p><div class="card-foot"><span>${dateText(n.updated)}</span><span class="tag">${labels[n.category]}</span></div></button>`).join(''):'<div class="empty">这里还没有笔记<br>试试新建一篇，或调整搜索内容</div>';
const nav=[['all','▤'],['starred','☆'],['trash','♧']];$('navigation').innerHTML=nav.map(([key,icon])=>`<button class="nav ${filter===key?'active':''}" data-filter="${key}"><span>${icon}</span>${labels[key]}<span class="count">${notes.filter(n=>key==='trash'?n.deleted:!n.deleted&&(key==='all'||n.starred)).length}</span></button>`).join('');$('categories').innerHTML=['工作','生活','灵感'].map((key,i)=>`<button class="nav ${filter===key?'active':''}" data-filter="${key}"><span class="dot ${['','green','blue'][i]}"></span>${labels[key]}<span class="count">${notes.filter(n=>!n.deleted&&n.category===key).length}</span></button>`).join('');$('mobileFilter').value=filter;}
function inline(text){return escape(text).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');}
function markdown(text){let inList=false;let html='';for(const line of text.split('\n')){if(/^[-*] /.test(line)){if(!inList){html+='<ul>';inList=true;}html+='<li>'+inline(line.slice(2))+'</li>';continue;}if(inList){html+='</ul>';inList=false;}const h=line.match(/^(#{1,3}) (.*)$/);html+=h?`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`:line.startsWith('> ')?'<blockquote>'+inline(line.slice(2))+'</blockquote>':line.trim()?'<p>'+inline(line)+'</p>':'';}return html+(inList?'</ul>':'');}
function stats(){const n=current();if(!n)return;const count=n.body.replace(/\s/g,'').length;$('wordCount').textContent=`${count} 字`;$('readTime').textContent=`约 ${Math.max(1,Math.ceil(count/400))} 分钟阅读`;$('date').textContent=`创建于 ${dateText(n.created)}`;}
function renderEditor(){const n=current();$('content').classList.toggle('hidden',!n);$('noNote').classList.toggle('hidden',!!n);$('editor-bar');document.querySelector('.actions').classList.toggle('hidden',!n);if(!n){$('wordCount').textContent='';return;}$('title').value=n.title;$('body').value=n.body;$('category').value=n.category;$('crumbCategory').textContent=labels[n.category];$('star').textContent=n.starred?'★':'☆';$('star').classList.toggle('selected',n.starred);$('star').setAttribute('aria-pressed',String(n.starred));$('star').setAttribute('aria-label',n.starred?'取消收藏':'收藏笔记');$('restore').classList.toggle('hidden',!n.deleted);$('trash').title=n.deleted?'永久删除':'移入回收站';$('trash').setAttribute('aria-label',$('trash').title);$('title').readOnly=!!n.deleted;$('body').readOnly=!!n.deleted;$('category').disabled=!!n.deleted;document.querySelectorAll('[data-format]').forEach(b=>b.disabled=!!n.deleted);$('body').classList.toggle('hidden',preview);$('preview').classList.toggle('hidden',!preview);$('mode').textContent=preview?'编辑':'预览';if(preview)$('preview').innerHTML=markdown(n.body);stats();}
function select(id){activeId=id;renderLists();renderEditor();}
function refresh(){if(!visible().some(n=>n.id===activeId))activeId=visible()[0]?.id;renderLists();renderEditor();}
function update(){const n=current();if(!n||n.deleted)return;n.title=$('title').value;n.body=$('body').value;n.category=$('category').value;n.updated=Date.now();persist();renderLists();stats();$('crumbCategory').textContent=labels[n.category];}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const actions={new(){filter=['工作','生活','灵感'].includes(filter)?filter:'all';$('search').value='';const id=globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);notes.unshift({id,title:'',body:'',category:filter==='all'?'生活':filter,starred:false,deleted:false,created:Date.now(),updated:Date.now()});preview=false;persist();select(id);$('app').classList.add('editing');$('title').focus();},star(){const n=current();if(!n)return;n.starred=!n.starred;persist();refresh();},trash(){const n=current();if(!n)return;if(n.deleted){if(!confirm('永久删除这篇笔记？此操作无法恢复。'))return;notes=notes.filter(x=>x.id!==n.id);}else n.deleted=true;persist();refresh();notify(n.deleted?'笔记已移入回收站':'笔记已永久删除');},restore(){const n=current();if(!n)return;n.deleted=false;n.updated=Date.now();persist();refresh();notify('笔记已恢复到全部笔记');},export(){const n=current();if(n)download((n.title||'无标题笔记').replace(/[\\/:*?"<>|]/g,'_')+'.md','# '+(n.title||'无标题笔记')+'\n\n'+n.body,'text/markdown;charset=utf-8');},backup(){download('拾页笔记备份-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(notes,null,2),'application/json');notify('备份已导出');},mode(){preview=!preview;renderEditor();},back(){$('app').classList.remove('editing');}};
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action){actions[action.dataset.action]();return;}const card=e.target.closest('[data-id]');if(card){select(card.dataset.id);$('app').classList.add('editing');return;}const nav=e.target.closest('[data-filter]');if(nav){filter=nav.dataset.filter;refresh();return;}const tool=e.target.closest('[data-format]');if(tool){const n=current();if(!n||n.deleted)return;if(preview){preview=false;renderEditor();}const area=$('body'),start=area.selectionStart,end=area.selectionEnd,selected=area.value.slice(start,end);const formats={heading:['## ',''],bold:['**','**'],italic:['*','*'],list:['- ',''],quote:['> ',''],code:['`','`']};const [before,after]=formats[tool.dataset.format];const value=before+(selected||'文字')+after;area.setRangeText(value,start,end,'select');area.focus();update();}});
$('title').addEventListener('input',update);$('body').addEventListener('input',update);$('category').addEventListener('change',()=>{update();refresh();});$('search').addEventListener('input',refresh);$('sort').addEventListener('change',renderLists);$('mobileFilter').addEventListener('change',e=>{filter=e.target.value;refresh();});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('app').classList.remove('editing');$('search').focus();}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();persist();}});
refresh();if(storageFailed){$('saveStatus').textContent='本地数据读取失败，请检查浏览器存储';notify('无法读取本地笔记，当前显示示例；请先检查存储或导出备份');}else if(localStorage.getItem(KEY)===null)persist();
</script>
